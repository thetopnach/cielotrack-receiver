name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # So a release can be checked before it is cut, rather than after it has already
  # started installing itself on other people's hardware overnight.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-machine:
    name: contact state machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # radio_tracker imports python-dotenv at module scope, so without this every
      # test fails identically at import. It passed locally only because the Pi has
      # the package installed system-wide — the exact gap a clean CI machine exists
      # to catch.
      - name: Install dependencies
        run: pip install -r requirements.txt
      # One step per test, deliberately. A failing step names the test that failed, and
      # step names are visible without credentials to download the run log — "exit
      # code 1" over six tests is not a bug report. `if: always()` so one failure does
      # not hide the state of the others.
      - name: rekey during grace period
        if: always()
        run: python3 tests/test_receiver_state.py rekey_during_grace_period
      - name: expired cooldown does not suppress
        if: always()
        run: python3 tests/test_receiver_state.py expired_cooldown_does_not_suppress
      - name: cooldown still suppresses while live
        if: always()
        run: python3 tests/test_receiver_state.py cooldown_still_suppresses_while_live
      - name: both transports are credited
        if: always()
        run: python3 tests/test_receiver_state.py both_transports_are_credited
      - name: concurrent transports do not corrupt state
        if: always()
        run: python3 tests/test_receiver_state.py concurrent_transports_do_not_corrupt_state
      - name: write failures are reported then clear
        if: always()
        run: python3 tests/test_receiver_state.py write_failures_are_reported_then_clear

  state-paths:
    name: running unprivileged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: the capability decides whether sudo is used
        if: always()
        run: python3 tests/test_state_paths.py the_capability_decides_whether_sudo_is_used
      - name: the usb adapter wins over the board's own radio
        if: always()
        run: python3 tests/test_state_paths.py the_usb_adapter_wins_over_the_boards_own_radio
      - name: the state directory is resolved in order
        if: always()
        run: python3 tests/test_state_paths.py the_state_directory_is_resolved_in_order
      - name: a blank setting means unset
        if: always()
        run: python3 tests/test_state_paths.py a_blank_setting_means_unset
      - name: an identity left behind stops the receiver
        if: always()
        run: python3 tests/test_state_paths.py an_identity_left_behind_stops_the_receiver
      - name: the migration carries everything across
        if: always()
        run: python3 tests/test_state_paths.py the_migration_carries_everything_across
      - name: the migration is safe to run twice
        if: always()
        run: python3 tests/test_state_paths.py the_migration_is_safe_to_run_twice
      - name: a copy that does not verify leaves the original
        if: always()
        run: python3 tests/test_state_paths.py a_copy_that_does_not_verify_leaves_the_original

  updater:
    name: updater and rollback
    runs-on: ubuntu-latest
    steps:
      # The updater walks tag history, so a shallow clone would hide the thing under
      # test. This checkout is throwaway anyway — the test builds its own origin.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails loudly rather than letting the job pass by quietly skipping. A test that
      # silently does not run is worse than one that is missing, because it reports
      # green: that is exactly how a receiver ran for 17 hours looking healthy while
      # storing nothing.
      - name: Check the runner can actually run this
        run: |
          set -e
          systemctl is-system-running --quiet || \
            echo "note: system state is $(systemctl is-system-running || true)"
          systemctl --version | head -1
          sudo -n true
          echo "systemd and passwordless sudo are available"

      - name: Run the updater tests
        run: |
          set -o pipefail
          bash tests/test_update.sh 2>&1 | tee /tmp/updater.log

      - name: Publish the output
        if: always()
        run: |
          {
            echo '### updater and rollback'
            echo '```'
            tail -60 /tmp/updater.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  shell:
    name: shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Check the scripts that run as root
        run: |
          set -e
          for script in update.sh provision.sh tests/test_update.sh; do
            echo "== $script"
            bash -n "$script"
            # Warnings only. These scripts run as root on other people's machines, so
            # the bar is "no probable bugs", not "no style opinions".
            shellcheck -S warning "$script"
          done
